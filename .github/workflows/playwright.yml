name: Playwright & Allure Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    # Chạy tự động vào lúc 03:47 AM mỗi ngày (Giờ Việt Nam UTC+7 = 20:47 UTC)
    - cron: '47 20 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  test:
    name: Run Playwright Test Suite
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java for Allure CLI
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium

    - name: Run Playwright tests
      id: run_tests
      env:
        BASE_URL: ${{ secrets.BASE_URL || 'https://aicam.example.com' }}
        VALID_USERNAME: ${{ secrets.VALID_USERNAME }}
        VALID_PASSWORD: ${{ secrets.VALID_PASSWORD }}
        HEADLESS: 'true'
        CI: 'true'
      run: npm test
      continue-on-error: true

    - name: Generate Allure Report
      if: always()
      run: npm run allure:generate

    - name: Upload Playwright HTML Report Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: playwright-html-report
        path: playwright-report/
        retention-days: 14

    - name: Upload Allure Results Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: allure-raw-results
        path: allure-results/
        retention-days: 14

    - name: Upload Allure Report Artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: allure-report
        path: allure-report/
        retention-days: 14

    - name: Upload Pages artifact
      if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      uses: actions/upload-pages-artifact@v3
      with:
        path: allure-report/

    - name: Fail job if tests failed
      if: steps.run_tests.outcome != 'success'
      run: |
        echo "❌ Playwright tests encountered failures. Check the Allure Report artifact for details."
        exit 1

  deploy-pages:
    name: Deploy to GitHub Pages
    if: always() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    name: Send Telegram Notification
    needs: [test, deploy-pages]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Notification to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_RESULT: ${{ needs.test.result }}
          REPO_NAME: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPORT_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "⚠️ Telegram secrets (TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID) are not configured. Skipping notification."
            exit 0
          fi

          if [ "$TEST_RESULT" = "success" ]; then
            STATUS_ICON="✅"
            STATUS_TEXT="PASSED"
          else
            STATUS_ICON="❌"
            STATUS_TEXT="FAILED"
          fi

          SHORT_SHA=$(echo "$COMMIT_SHA" | cut -c1-7)

          MESSAGE="<b>${STATUS_ICON} Playwright Test Suite ${STATUS_TEXT}</b>%0A%0A"
          MESSAGE="${MESSAGE}📁 <b>Repository:</b> <code>${REPO_NAME}</code>%0A"
          MESSAGE="${MESSAGE}🌿 <b>Branch:</b> <code>${BRANCH}</code>%0A"
          MESSAGE="${MESSAGE}👤 <b>Author:</b> ${ACTOR}%0A"
          MESSAGE="${MESSAGE}📝 <b>Commit:</b> <code>${SHORT_SHA}</code> - ${COMMIT_MSG}%0A%0A"
          MESSAGE="${MESSAGE}📊 <b>Allure Report:</b> <a href=\"${REPORT_URL}\">View Live Report</a>%0A"
          MESSAGE="${MESSAGE}🔍 <b>CI Run Details:</b> <a href=\"${RUN_URL}\">View GitHub Run</a>"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "text=${MESSAGE}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true"
